<body>
    <h4 class="bg-danger text-center text-black">TODO CRUD WITH LOCAL STORAGE 1 !!</h4>
    <div class="container mt-4 mb-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <form id="todoForm">
                            <div class="form-group">
                                <lable for="inputControl">Enter Todo</lable>
                                <input type="text" class="form-control" id="inputTodo" required placeholder="">
                                <div>
                                    <button type="submit" class="btn btn-outline-primary  btn-sm btn-block mt-4" id="addBtn">
                                        Add todo
                                    </button>
                                    <button type="button" class="btn btn-success btn-block mt-4 d-none" id="updateBtn">
                                        Update Todo</button>

                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mt5">
                <div class="card">
                    <div class="card-body">
                        <ul class="list-group" id="todoList">
                            <!-- <li class="list-group-item d-flex justify-content-between">

                                    <i class="fa-solid fa-pen-to-square fa-2x text-primary"></i>
                                    <i class="fa-solid fa-trash ml-4  fa-2x text-danger" role="button"></i>
                                </div>
                            </li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="assets/app.js"></script>
